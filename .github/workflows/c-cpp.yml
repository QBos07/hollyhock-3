name: C/C++ CI

on:
  schedule:
    - cron: '6 9 1 */2 *'
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Needed for arm64 containers at the moment
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          platforms: 'arm64'

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ghcr.io
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ghcr.io/${{ github.event.pull_request.base.repo.full_name || github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=pr-${{ github.event.pull_request.number }},event=pr \
              enable={{ github.event.pull_request.head.repo.full_name == github.repository }}
            type=raw,value=pr-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.number }},event=pr \
              enable={{ github.event.pull_request.head.repo.full_name != github.repository }}
          annotations: |
            org.opencontainers.image.source=${{ github.event_name == 'pull_request' && format('https://github.com/{0}/pull/{1}', github.event.pull_request.base.repo.full_name, github.event.pull_request.number) || format('https://github.com/{0}', github.repository) }}


      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: sdk
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DOCKER_METADATA_OUTPUT_JSON
          #cache-from: type=gha
          #cache-to: type=gha,mode=max
          no-cache: ${{ github.event_name == 'cron' }}

      # Sign the resulting Docker image digest.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
        
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}@${{ steps.build-and-push.outputs.digest }}
        
  build-artifact:
    needs: build-sdk
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-sdk.outputs.image }}
      credentials:
       username: ${{ github.actor }}
       password: ${{ secrets.github_token }}

    steps:
    - uses: actions/checkout@v4
        
    - name: build the example
      run: make -j -C app_template
      
    - name: build the demos
      run: for dir in $(dirname demos/*/Makefile); do make -j -C $dir; done

    - uses: actions/upload-artifact@v4
      with:
        path: | 
          **/*.elf
          **/*.map
          **/*.bin
          **/*.hh3
          !patches/**
